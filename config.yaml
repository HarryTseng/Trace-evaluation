receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  
  probabilistic_sampler:
    sampling_percentage: 100

  # tail_sampling:
  #   decision_wait: 5s

  #   policies:
      # - name: error-trace
      #   type: status_code
      #   status_code:
      #     status_codes: [ERROR]

exporters:
  debug:
    verbosity: detailed
  file:
    path: /etc/otelcol/traces.json

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [debug, file]
